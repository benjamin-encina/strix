spring.application.name=ms-usuarios
server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3306/strix_usuarios
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=strix-super-secret-key-2025-must-be-at-least-256-bits-long
jwt.expiration-ms=86400000

# URLs otros microservicios
strix.ms-notificaciones.url=http://localhost:8088

# Dialecto Hibernate para MariaDB 10.4
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
