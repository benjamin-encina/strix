spring.application.name=ms-tickets
server.port=8084
spring.datasource.url=jdbc:mariadb://localhost:3306/strix_mstickets
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
strix.ms-categorias.url=http://localhost:8082
strix.ms-prioridades.url=http://localhost:8083
strix.ms-historial.url=http://localhost:8086
strix.ms-notificaciones.url=http://localhost:8088

# Dialecto Hibernate para MariaDB 10.4
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
